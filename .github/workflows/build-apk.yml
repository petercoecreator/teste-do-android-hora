name: Compilar e publicar Relógio Remoto

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'windows/**'
      - '.github/workflows/build-apk.yml'
      - 'README.md'

permissions:
  contents: write

jobs:
  android:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RelogioRemoto-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Compilar aplicativo Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install --upgrade pip pyinstaller PySide6 "qrcode[pil]"
      - name: Gerar aplicativo Windows
        run: pyinstaller --noconfirm --clean --onefile --windowed --name RelogioRemoto windows/servidor.py
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Criar instalador
        run: iscc windows/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: RelogioRemoto-Instalador-Windows
          path: windows/Output/RelogioRemoto-Setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar aplicativos
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RelogioRemoto-APK
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: RelogioRemoto-Instalador-Windows
          path: release-files
      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Relógio Remoto 2.0 - build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            release-files/app-debug.apk
            release-files/RelogioRemoto-Setup.exe
